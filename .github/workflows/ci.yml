name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.task.name }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19.0 is the declared engines floor (inherited from undici) — pin it
        # exactly so a dependency quietly raising the floor fails CI instead of
        # only failing users. 22/24 float to the latest of each supported major.
        node: ['22.19.0', 22, 24]
        task:
          - name: Typecheck
            command: npm run typecheck
          - name: Client typecheck
            command: npm run typecheck:client
          - name: Tests
            command: npm test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}
